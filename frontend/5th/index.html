<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호텔 전등 리모컨 - 5단계</title>
<style>
body{font-family:system-ui,sans-serif;background:#1c2130;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
main{background:#30394d;border-radius:18px;padding:32px;text-align:center;width:min(85vw,360px)}
button{padding:12px 26px;margin:5px;border:0;border-radius:9px;font-size:16px;cursor:pointer}
#on{background:#fbd05c}#off{background:#d6dce8}.lamp{font-size:62px}.lit{filter:drop-shadow(0 0 15px gold)}
small{color:#c9d0e0}
</style></head>
<body><main><small>호텔 전등 리모컨 · 5단계</small><h1>호텔 전등 리모컨</h1>
<div id="lamp" class="lamp">💡</div><p>전등 상태: <strong id="state">연결 중</strong></p><button id="on" disabled>ON</button><button id="off" disabled>OFF</button><p><small id="message">WebSocket 연결 중…</small></p>
</main><script>
const lamp=document.getElementById('lamp'),state=document.getElementById('state'),message=document.getElementById('message');
const buttons=[document.getElementById('on'),document.getElementById('off')];
let socket;
function draw(on){state.textContent=on?'켜짐':'꺼짐';lamp.classList.toggle('lit',on);}
function connect(){
 const protocol=location.protocol==='https:'?'wss':'ws';
 socket=new WebSocket(`${protocol}://${location.host}/ws`);
 socket.onopen=()=>{message.textContent='서버 연결됨';buttons.forEach(b=>b.disabled=false);};
 socket.onmessage=event=>{
  try{const data=JSON.parse(event.data);
   if(data.type==='state')draw(data.on);
   else if(data.type==='error')message.textContent='오류: '+data.message;
  }catch(error){message.textContent='응답 해석 오류';}
 };
 socket.onclose=()=>{message.textContent='연결 끊김 · 재연결 중';buttons.forEach(b=>b.disabled=true);setTimeout(connect,2000);};
 socket.onerror=()=>{message.textContent='WebSocket 연결 오류';};
}
function sendCommand(on){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'set',on}));}
document.getElementById('on').onclick=()=>sendCommand(true);
document.getElementById('off').onclick=()=>sendCommand(false);
connect();
</script></body></html>
