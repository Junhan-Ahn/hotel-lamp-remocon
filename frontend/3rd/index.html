<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호텔 전등 리모컨 - 3단계</title>
<style>
body{font-family:system-ui,sans-serif;background:#1c2130;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
main{background:#30394d;border-radius:18px;padding:32px;text-align:center;width:min(85vw,360px)}
button{padding:12px 26px;margin:5px;border:0;border-radius:9px;font-size:16px;cursor:pointer}
#on{background:#fbd05c}#off{background:#d6dce8}.lamp{font-size:62px}.lit{filter:drop-shadow(0 0 15px gold)}
small{color:#c9d0e0}
</style></head>
<body><main><small>호텔 전등 리모컨 · 3단계</small><h1>호텔 전등 리모컨</h1>
<div id="lamp" class="lamp">💡</div><p>전등 상태: <strong id="state">꺼짐</strong></p><button id="on">ON</button><button id="off">OFF</button><p><small>브라우저 안에서만 상태가 바뀝니다.</small></p>
</main><script>
const lamp=document.getElementById('lamp');
const state=document.getElementById('state');
function draw(on){state.textContent=on?'켜짐':'꺼짐';lamp.classList.toggle('lit',on);}
document.getElementById('on').addEventListener('click',()=>draw(true));
document.getElementById('off').addEventListener('click',()=>draw(false));
</script></body></html>
